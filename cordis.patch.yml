# dsh-plugin-workshop 的激活补丁。
# 本包在 package.json 的 dsh.bundle.patch 中声明此文件：
# 经 `dsh plugin add` 安装后会被自动加入该 profile 的 dsh.profile.bundles，
# 启动时作为 bundle 补丁层应用下面这行激活（无需手动改 cordis.patch.yml）。
# 手动接入其它 profile 时，也可把本行复制进该 profile 的 cordis.patch.yml。
- insert:
    - id: plugin-workshop
      name: '@dsh-external/dsh-plugin-workshop'
